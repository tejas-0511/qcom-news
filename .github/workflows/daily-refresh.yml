name: Daily News Refresh

on:
  schedule:
    # Runs at 05:30 UTC daily = ~11:00 AM IST
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run news fetch script
        run: python scripts/fetch_news.py

      - name: Commit updated articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: refresh news feed [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
